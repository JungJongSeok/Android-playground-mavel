name: Android CI

on:
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Cache JDK
      uses: actions/cache@v3
      with:
        path: |
          ~/.sdkman
          ~/.java
          ~/.m2/toolchains.xml
        key: jdk-${{ runner.os }}-17-temurin

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: touch local.properties
      env:
        MARVEL_PRIVATE_KEY: ${{ secrets.MARVEL_PRIVATE_KEY }}
        MARVEL_PUBLIC_KEY: ${{ secrets.MARVEL_PUBLIC_KEY }}
      run: echo -e "marvel_private_key ="$MARVEL_PRIVATE_KEY"\nmarvel_public_key = "$MARVEL_PUBLIC_KEY"" > ./local.properties

    - name: Build Clean
      run: bash ./gradlew clean build

    - name: Build with Gradle
      run: ./gradlew build
